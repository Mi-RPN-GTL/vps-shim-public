name: VPS-Shim Watchdog

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Check last session heartbeat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN=$(curl -s \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/runner.yml/runs?per_page=1&status=completed" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('workflow_runs',[]); print(r[0]['updated_at'] if r else '')")

          if [ -z "$LAST_RUN" ]; then
            echo "no completed runs found, dispatching a fresh session"
            SHOULD_HEAL=1
          else
            LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
            NOW_EPOCH=$(date +%s)
            GAP=$((NOW_EPOCH - LAST_EPOCH))
            echo "last completed session was ${GAP}s ago"
            if [ "$GAP" -gt 2400 ]; then
              SHOULD_HEAL=1
            else
              SHOULD_HEAL=0
            fi
          fi

          if [ "$SHOULD_HEAL" = "1" ]; then
            IN_PROGRESS=$(curl -s \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/runner.yml/runs?per_page=5&status=in_progress" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('workflow_runs',[])))")
            if [ "$IN_PROGRESS" -gt 0 ]; then
              echo "a session is already in progress, not healing"
              exit 0
            fi
            echo "dispatching a fresh session"
            curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"restart-shim-runner"}'
          fi
