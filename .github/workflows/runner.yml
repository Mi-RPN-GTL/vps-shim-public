name: VPS-Shim Runner

# ══════════════════════════════════════════════════════════════════
# Warm-handoff model (this revision).
#
# Two jobs, same workflow file, same concurrency group:
#
#   `session` -- the currently-active job. Runs setup, activates
#   (bot/webui/tunnel + resumes prior launched processes), then runs
#   the shared sync loop (vps-shim/scripts/sync_loop.sh). At T-20m
#   remaining in its own budget, it dispatches a `standby` run via
#   repository_dispatch (event: dispatch-standby-shim-runner). At its
#   own budget end it shuts down, checkpoints, writes+pushes a
#   go-file (vps-shim/state/go_standby.json), and exits. It no longer
#   dispatches its successor directly -- that's `standby`'s job now,
#   once `standby` sees the go-file.
#
#   `standby` -- dispatched ~20 minutes before the current session
#   ends. Runs the SAME setup (setup_env.sh) ahead of time, on its
#   own fresh runner VM, then polls for the go-file. The moment it
#   sees one, it activates (same activate.sh session uses) and falls
#   into the same sync_loop.sh -- becoming the new active session, in
#   place, on the same job/run. It will itself dispatch the next
#   standby at ITS OWN T-20m, via the same sync_loop.sh logic.
#
# This means there is close to zero cold gap between one session
# ending and its successor being ready: standby's setup (venv, deps,
# cloudflared install, etc) already happened during the outgoing
# session's last 20 minutes, in parallel, on a separate VM. The only
# serialized part is: outgoing session's own shutdown + checkpoint
# push + go-file push, then standby's git pull of that checkpoint +
# activation -- seconds, not the old 10-minute enforced cold gap.
#
# FALLBACK (no standby was ever dispatched -- session crashed/was
# cancelled before reaching T-20m, or the dispatch call itself
# failed): nothing here recovers that automatically. watchdog.yml
# polls every 20 minutes; if it sees no completed runner.yml run
# recently and nothing in_progress, it dispatches a fresh cold
# `restart-shim-runner` session exactly as before. Worst case is a
# gap bounded by the watchdog's own poll interval, not an indefinite
# stall.
#
# Both jobs share the SAME concurrency group as before
# (vps-shim-runner, cancel-in-progress: true) specifically so that
# shimdeploy.py's redeploy path (disable workflow, then
# cancel_inflight_runs() across the whole repo) still force-cancels
# a `standby` run exactly like it does `session` -- a redeploy must
# not leave a standby alive on stale code. cancel_inflight_runs()
# cancels every active run repo-wide already (confirmed: it is not
# scoped to a single workflow file), so no change was needed there.
#
# What did NOT change from the prior revision: RUN_BUDGET_SECONDS
# (5h50m), the reason schedule: cron is not used for anything
# timing-sensitive (see prior notes, still true), the mechanics of
# git_pull.sh/git_push.sh, and cancel-in-progress's tradeoff
# (a healthy mid-flight session gets cut off immediately by a manual
# redeploy rather than finishing gracefully -- deliberately accepted,
# see prior notes).
# ══════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart-shim-runner, dispatch-standby-shim-runner]

concurrency:
  group: vps-shim-runner
  cancel-in-progress: true

env:
  RUN_BUDGET_SECONDS: 21000
  # Retained for the fallback/manual path only -- standby's normal
  # dispatch has no fixed sleep gap (see header). Kept in case a
  # manual workflow_dispatch of `session` is ever used without a
  # standby cycle already primed (e.g. very first cold start).
  DOWNTIME_GAP_SECONDS: 600
  STANDBY_DISPATCH_LEAD_SECONDS: 1200

jobs:
  session:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'restart-shim-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Record session start
        id: start
        run: |
          START_EPOCH=$(date +%s)
          echo "start_epoch=${START_EPOCH}" >> "$GITHUB_OUTPUT"
          echo "Session started at $(date -u -d @${START_EPOCH} '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Setup environment
        env:
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
        run: |
          # setup_env.sh isn't on disk yet on a fresh runner -- bootstrap
          # it the same way git_pull.sh used to be bootstrapped, then
          # hand off to the checked-out copy for everything after.
          curl -s -H "Authorization: token ${SHIM_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_OWNER}/${PRIVATE_REPO_NAME}/contents/vps-shim/scripts/setup_env.sh" \
            | python3 -c "import sys,json,base64; d=json.load(sys.stdin); print(base64.b64decode(d['content']).decode())" \
            > /tmp/setup_env.sh
          chmod +x /tmp/setup_env.sh
          SHIM_ROOT=/home/runner/shim GH_OWNER="${GH_OWNER}" PRIVATE_REPO_NAME="${PRIVATE_REPO_NAME}" SHIM_PAT="${SHIM_PAT}" bash /tmp/setup_env.sh

      - name: Activate (launch bot/webui/tunnel, resume processes)
        env:
          SHIM_BOT_TOKEN: ${{ secrets.SHIM_BOT_TOKEN }}
          SHIM_OWNER_CHAT_ID: ${{ secrets.SHIM_OWNER_CHAT_ID }}
          SHIM_ROOT: /home/runner/shim
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
          MIAPORTAL_BASE_URL: ${{ vars.MIAPORTAL_BASE_URL }}
          ACTIVATION_REASON: cold-start
        run: |
          bash /home/runner/shim/repo/vps-shim/scripts/activate.sh

      - name: Sync loop within budget (dispatches standby at T-20m, hands off at T-0)
        env:
          START_EPOCH: ${{ steps.start.outputs.start_epoch }}
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
          SHIM_BOT_TOKEN: ${{ secrets.SHIM_BOT_TOKEN }}
          SHIM_OWNER_CHAT_ID: ${{ secrets.SHIM_OWNER_CHAT_ID }}
        run: |
          bash /home/runner/shim/repo/vps-shim/scripts/sync_loop.sh

      - name: Final checkpoint push (always, including on cancellation)
        if: always()
        env:
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
        run: |
          bash /home/runner/shim/repo/vps-shim/scripts/git_push.sh "checkpoint: final (workflow always-run step)" || true

  standby:
    if: github.event.action == 'dispatch-standby-shim-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Setup environment (ahead of promotion)
        env:
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
        run: |
          curl -s -H "Authorization: token ${SHIM_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_OWNER}/${PRIVATE_REPO_NAME}/contents/vps-shim/scripts/setup_env.sh" \
            | python3 -c "import sys,json,base64; d=json.load(sys.stdin); print(base64.b64decode(d['content']).decode())" \
            > /tmp/setup_env.sh
          chmod +x /tmp/setup_env.sh
          SHIM_ROOT=/home/runner/shim GH_OWNER="${GH_OWNER}" PRIVATE_REPO_NAME="${PRIVATE_REPO_NAME}" SHIM_PAT="${SHIM_PAT}" bash /tmp/setup_env.sh

      - name: Wait for go-file (outgoing session's promotion signal)
        id: wait
        env:
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
        run: |
          # Setup finished well before T-0 in the normal case (setup is
          # a couple of minutes; the lead time is 20). Poll by re-pulling
          # the checkpoint repo -- cheap, and it's how this job will see
          # the go-file the outgoing session pushes at its own T-0.
          #
          # Ceiling: RUN_BUDGET_SECONDS + a generous margin, so a standby
          # that somehow never sees a go-file (outgoing session crashed
          # AFTER dispatching standby but BEFORE reaching its own T-0)
          # doesn't wait forever and burn its whole 355-minute job
          # allotment doing nothing -- it gives up and lets the
          # watchdog's cold-start fallback take over instead.
          WAIT_CEILING_SECONDS=1800
          WAITED=0
          GO_FILE="/home/runner/shim/repo/vps-shim/state/go_standby.json"
          while [ ! -f "$GO_FILE" ]; do
            if [ "$WAITED" -ge "$WAIT_CEILING_SECONDS" ]; then
              echo "no go-file after ${WAIT_CEILING_SECONDS}s -- giving up, watchdog fallback will cold-start instead"
              echo "promoted=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
            WAITED=$((WAITED + 15))
            bash /home/runner/shim/repo/vps-shim/scripts/git_pull.sh > /dev/null 2>&1 || true
          done
          echo "go-file found after ${WAITED}s -- promoting"
          echo "promoted=1" >> "$GITHUB_OUTPUT"

      - name: Record promotion time
        id: promote_start
        if: steps.wait.outputs.promoted == '1'
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Activate (promoted -- becomes the new active session)
        if: steps.wait.outputs.promoted == '1'
        env:
          SHIM_BOT_TOKEN: ${{ secrets.SHIM_BOT_TOKEN }}
          SHIM_OWNER_CHAT_ID: ${{ secrets.SHIM_OWNER_CHAT_ID }}
          SHIM_ROOT: /home/runner/shim
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
          MIAPORTAL_BASE_URL: ${{ vars.MIAPORTAL_BASE_URL }}
          ACTIVATION_REASON: warm-handoff
        run: |
          # Consume the go-file so a stale copy can't cause a second,
          # bogus promotion later (e.g. if this repo state were ever
          # re-pulled without a fresh go-file present).
          rm -f /home/runner/shim/repo/vps-shim/state/go_standby.json
          bash /home/runner/shim/repo/vps-shim/scripts/activate.sh

      - name: Sync loop within budget (now the active session)
        if: steps.wait.outputs.promoted == '1'
        env:
          START_EPOCH: ${{ steps.promote_start.outputs.start_epoch }}
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
          SHIM_BOT_TOKEN: ${{ secrets.SHIM_BOT_TOKEN }}
          SHIM_OWNER_CHAT_ID: ${{ secrets.SHIM_OWNER_CHAT_ID }}
        run: |
          bash /home/runner/shim/repo/vps-shim/scripts/sync_loop.sh

      - name: Final checkpoint push (always, including on cancellation)
        if: always()
        env:
          GH_OWNER: ${{ github.repository_owner }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SHIM_PAT: ${{ secrets.SHIM_PAT }}
        run: |
          bash /home/runner/shim/repo/vps-shim/scripts/git_push.sh "checkpoint: final (workflow always-run step)" || true
